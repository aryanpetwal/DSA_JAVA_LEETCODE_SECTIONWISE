name: Update LeetCode Stats

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Calculate LeetCode statistics
        shell: bash
        run: |
          python - <<'PY'
          import os

          counts = {
              "EASY": 0,
              "MEDIUM": 0,
              "HARD": 0
          }

          for root, dirs, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue

              for difficulty in counts:
                  if os.sep + difficulty.title() + os.sep in root:
                      counts[difficulty] += 1

          total = counts["EASY"] + counts["MEDIUM"] + counts["HARD"]

          print(f"Easy: {counts['EASY']}")
          print(f"Medium: {counts['MEDIUM']}")
          print(f"Hard: {counts['HARD']}")
          print(f"Total: {total}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"EASY={counts['EASY']}\n")
              f.write(f"MEDIUM={counts['MEDIUM']}\n")
              f.write(f"HARD={counts['HARD']}\n")
              f.write(f"TOTAL={total}\n")
          PY

      - name: Update README
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          path = "README.md"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          easy = os.environ["EASY"]
          medium = os.environ["MEDIUM"]
          hard = os.environ["HARD"]
          total = os.environ["TOTAL"]

          new_stats = f"""**Total Problems Solved: {total}**

          | Difficulty | Solved |
          |------------|--------|
          | 🟢 Easy | {easy} |
          | 🟡 Medium | {medium} |
          | 🔴 Hard | {hard} |"""

          pattern = r"<!-- LEETCODE-STATS:START -->.*?<!-- LEETCODE-STATS:END -->"

          replacement = (
              "<!-- LEETCODE-STATS:START -->\n\n"
              + new_stats
              + "\n\n<!-- LEETCODE-STATS:END -->"
          )

          content = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit updated README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LeetCode statistics"
            git push
          fi
