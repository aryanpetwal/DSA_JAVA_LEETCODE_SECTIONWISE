name: Update LeetCode Stats

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate LeetCode statistics
        shell: bash
        run: |
          EASY=$(find . -type d -path "*/Easy/*" | grep -v ".git" | wc -l)
          MEDIUM=$(find . -type d -path "*/Medium/*" | grep -v ".git" | wc -l)
          HARD=$(find . -type d -path "*/Hard/*" | grep -v ".git" | wc -l)

          TOTAL=$((EASY + MEDIUM + HARD))

          echo "EASY=$EASY" >> $GITHUB_ENV
          echo "MEDIUM=$MEDIUM" >> $GITHUB_ENV
          echo "HARD=$HARD" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Update README
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          path = "README.md"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          easy = os.environ["EASY"]
          medium = os.environ["MEDIUM"]
          hard = os.environ["HARD"]
          total = os.environ["TOTAL"]

          new_stats = f"""**Total Problems Solved: {total}**

          | Difficulty | Solved |
          |------------|--------|
          | 🟢 Easy | {easy} |
          | 🟡 Medium | {medium} |
          | 🔴 Hard | {hard} |"""

          pattern = r"<!-- LEETCODE-STATS:START -->.*?<!-- LEETCODE-STATS:END -->"

          replacement = (
              "<!-- LEETCODE-STATS:START -->\n\n"
              + new_stats
              + "\n\n<!-- LEETCODE-STATS:END -->"
          )

          content = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit updated README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LeetCode statistics"
            git push
          fi
          name: Update LeetCode Stats

